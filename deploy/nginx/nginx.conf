# Nginx delante de la API (TLS termina aquí). Plantilla: ajusta dominio y rutas de certificados.
#
#  - HTTP -> HTTPS con 301; solo TLS 1.2/1.3 con suites AEAD; HSTS de 2 años.
#  - La API ADEMÁS rechaza peticiones sin X-Forwarded-Proto=https (segunda barrera).
#  - Nginx NO sirve archivos: los documentos KYC viven en S3 privado y solo salen por la API.
#  - Límites por IP para login y subidas (la API tiene los suyos por usuario).
#  - No se registran cuerpos ni cabeceras Authorization; la URL de tickets se enmascara en el log.

worker_processes auto;
events { worker_connections 1024; }

http {
    server_tokens off;
    charset utf-8;
    sendfile off;                       # nunca servimos archivos del disco

    # --- Logs sin datos sensibles -------------------------------------------------
    # El ticket de visualización va en la ruta: se reemplaza antes de escribir el log.
    map $request_uri $safe_uri {
        "~^(?<p>/api/v1/kyc/file-views/)[A-Za-z0-9_-]+" "${p}[TICKET]";
        "~^(?<q>[^?]*)\?"                               "$q?[QUERY]";
        default                                         $request_uri;
    }
    log_format seguro '$remote_addr - [$time_iso8601] "$request_method $safe_uri" '
                      '$status $body_bytes_sent $request_time "$http_user_agent"';
    access_log /var/log/nginx/access.log seguro;

    # --- Límites por IP -------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;
    limit_req_zone $binary_remote_addr zone=uploads:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:20m     rate=20r/s;
    limit_req_status 429;

    upstream api {
        server 127.0.0.1:8000;          # uvicorn/gunicorn escuchando SOLO en localhost
        keepalive 32;
    }

    # --- HTTP: solo redirección (y validación de certificados ACME) ----------------------
    server {
        listen 80;
        listen [::]:80;
        server_name api.multiservicios.mx;
        location /.well-known/acme-challenge/ { root /var/www/acme; }
        location / { return 301 https://$host$request_uri; }
    }

    # --- HTTPS -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name api.multiservicios.mx;

        ssl_certificate     /etc/letsencrypt/live/api.multiservicios.mx/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.multiservicios.mx/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        client_max_body_size 11m;       # KYC_MAX_FILE_BYTES (10 MB) + margen del multipart
        client_body_timeout 30s;
        client_header_timeout 15s;

        # Encabezados que la API usa: esquema real y la IP del cliente (Nginx la sobrescribe).
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;

        location = /api/v1/auth/token {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://api;
        }
        location ~ ^/api/v1/auth/(register|password) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://api;
        }
        location ~ ^/api/v1/technicians/me/kyc/documents/[^/]+/files/ {
            limit_req zone=uploads burst=10 nodelay;
            proxy_request_buffering on;             # el archivo llega completo antes de molestar a la API
            proxy_pass http://api;
        }
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://api;
        }
        location = /health { proxy_pass http://api; access_log off; }

        # Todo lo demás no existe: ni estáticos, ni listado, ni el almacenamiento.
        location / { return 404; }
    }
}
