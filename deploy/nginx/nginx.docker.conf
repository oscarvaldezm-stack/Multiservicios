# Nginx para el entorno LOCAL de docker compose (http://localhost:8080).
# Mismos límites y logs sin datos sensibles que nginx.conf; SIN TLS porque solo escucha en
# 127.0.0.1 de tu máquina. En producción usa nginx.conf (TLS 1.2/1.3, HSTS, certificados).

worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    server_tokens off;
    charset utf-8;
    sendfile off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    map $request_uri $safe_uri {
        "~^(?<p>/api/v1/kyc/file-views/)[A-Za-z0-9_-]+" "${p}[TICKET]";
        "~^(?<q>[^?]*)\?"                               "$q?[QUERY]";
        default                                         $request_uri;
    }
    log_format seguro '$remote_addr - [$time_iso8601] "$request_method $safe_uri" '
                      '$status $body_bytes_sent $request_time "$http_user_agent"';
    access_log /dev/stdout seguro;
    error_log  /dev/stderr warn;

    limit_req_zone $binary_remote_addr zone=auth:10m     rate=10r/m;
    limit_req_zone $binary_remote_addr zone=uploads:10m  rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:20m      rate=20r/s;
    limit_req_zone $binary_remote_addr zone=webhooks:10m rate=50r/s;
    limit_req_status 429;

    upstream api {
        server api:8000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name localhost;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        client_max_body_size 11m;
        client_body_timeout 30s;
        client_header_timeout 15s;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;

        location = /api/v1/auth/token {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://api;
        }
        location ~ ^/api/v1/auth/(register|password) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://api;
        }
        location ~ ^/api/v1/technicians/me/kyc/documents/[^/]+/files/ {
            limit_req zone=uploads burst=10 nodelay;
            proxy_request_buffering on;
            proxy_pass http://api;
        }
        # Webhooks de Stripe: cuerpo pequeño (la API además limita a WEBHOOK_MAX_BODY_BYTES) y
        # ráfagas más amplias; la autenticación es la firma, que valida la API.
        location ~ ^/api/v1/webhooks/ {
            limit_req zone=webhooks burst=100 nodelay;
            client_max_body_size 1m;
            proxy_pass http://api;
        }
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://api;
        }
        location = /health { proxy_pass http://api; access_log off; }
        location = /docs { proxy_pass http://api; }            # solo existe fuera de producción
        location = /openapi.json { proxy_pass http://api; }

        location / { return 404; }
    }
}
